name: STYLST B-roll weekly sync
on:
  schedule:
    - cron: "0 15 * * 0"   # Sunday 08:00 PDT (UTC-7)
    - cron: "0 16 * * 0"   # Sunday 08:00 PST (UTC-8); the guard below runs only the right one
  workflow_dispatch:
    inputs:
      dry_run: {description: "List what would be created, create nothing", type: boolean, default: true}
      only_ids: {description: "Comma list of original file IDs (pilot test)", type: string, default: ""}
permissions: {contents: write, issues: write}
concurrency: {group: broll-sync, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pacific-time guard and production gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            [ "$(TZ=America/Los_Angeles date +%H)" = "08" ] || { echo "run=false" >> $GITHUB_OUTPUT; exit 0; }
            # Scheduled runs are production runs. Off until the cutover is approved.
            [ "${{ vars.BROLL_PRODUCTION }}" = "true" ] || { echo "::warning::BROLL_PRODUCTION is not 'true'; scheduled run skipped"; echo "run=false" >> $GITHUB_OUTPUT; exit 0; }
          fi
          echo "run=true" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: {python-version: "3.12"}
      - name: Install and unit test
        if: steps.gate.outputs.run == 'true'
        working-directory: broll-sync
        run: pip install requests && python -m unittest discover -s tests -t .
      - name: Sync
        if: steps.gate.outputs.run == 'true'
        working-directory: broll-sync
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
            [ -n "${{ inputs.only_ids }}" ] && ARGS="$ARGS --only-ids ${{ inputs.only_ids }}"
          fi
          python -m broll_sync $ARGS | tee run.log
      - name: Save durable run record (branch broll-state)
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('broll-sync/state/runs.jsonl') != ''
        run: |
          git config user.name "broll-sync"; git config user.email "broll-sync@users.noreply.github.com"
          git fetch origin broll-state 2>/dev/null && git checkout -B broll-state origin/broll-state -- 2>/dev/null || git checkout --orphan broll-state
          mkdir -p /tmp/st && cp broll-sync/state/* /tmp/st/ 2>/dev/null || true
          git rm -rf -q . 2>/dev/null || true; mkdir -p state
          git show origin/broll-state:state/runs.jsonl >> state/runs.jsonl 2>/dev/null || true
          git show origin/broll-state:state/mapping.jsonl >> state/mapping.jsonl 2>/dev/null || true
          cat /tmp/st/runs.jsonl >> state/runs.jsonl; cat /tmp/st/mapping.jsonl >> state/mapping.jsonl
          git add state && git commit -q -m "run record $(date -u +%FT%TZ)" && git push -q origin broll-state
      - name: Alert (open or update one issue) only on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "B-roll sync needs attention";
            const body = `Run ${context.runId} failed or was partial: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nExit 2 = Google sign-in needs renewing. Exit 1 = some folders/files could not be processed; unfinished work is retried next run.`;
            const open = await github.rest.issues.listForRepo({...context.repo, state: "open", per_page: 100});
            const ex = open.data.find(i => i.title === title);
            if (ex) await github.rest.issues.createComment({...context.repo, issue_number: ex.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with: {name: broll-run-log, path: broll-sync/run.log, retention-days: 90}
