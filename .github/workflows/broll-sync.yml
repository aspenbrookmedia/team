name: STYLST B-roll weekly sync (production)
# Scheduled runs only act when repository variable BROLL_PRODUCTION == 'true' (currently not set).
on:
  schedule:
    - cron: "0 15 * * 0"   # Sunday 08:00 PDT
    - cron: "0 16 * * 0"   # Sunday 08:00 PST; the guard below lets only the correct one run
  workflow_dispatch:
    inputs:
      dry_run: {description: "Read-only preview (no writes, no saved state)", type: boolean, default: true}
permissions: {contents: write, issues: write}
concurrency: {group: broll-sync, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Gate
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            [ "$(TZ=America/Los_Angeles date +%H)" = "08" ] || run=false
          fi
          if [ "$run" = true ] && [ "${{ github.event_name }}" = "schedule" -o "${{ inputs.dry_run }}" = "false" ]; then
            [ "${{ vars.BROLL_PRODUCTION }}" = "true" ] || { echo "::warning::BROLL_PRODUCTION is not true; production writes are off"; run=false; }
          fi
          echo "run=$run" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: {python-version: "3.12"}
      - name: Load saved state
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p broll-sync/state
          if git rev-parse -q --verify origin/broll-state >/dev/null; then git archive origin/broll-state state | tar -x -C broll-sync; fi
      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        working-directory: broll-sync
        run: pip install requests && python -m unittest discover -s tests -t .
      - name: Sync
        if: steps.gate.outputs.run == 'true'
        working-directory: broll-sync
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          ARGS=""; [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python -m broll_sync $ARGS
      - name: Save state (also after a partial/failed run)
        if: always() && steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: bash broll-sync/tools/save_state.sh
      - name: Alert once (open/update one issue) on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "B-roll sync needs attention";
            const body = `Run failed or was partial: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nExit 2 = Google sign-in/access needs a human. Exit 1 = some items could not be processed; they are retried next run.`;
            const open = await github.rest.issues.listForRepo({...context.repo, state: "open", per_page: 100});
            const ex = open.data.find(i => i.title === title);
            if (ex) await github.rest.issues.createComment({...context.repo, issue_number: ex.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
